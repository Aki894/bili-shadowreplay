name: Inspect draft Linux packages

on:
  push:
    branches: [fix/appimage-runtime]

permissions:
  # GitHub requires push access to read draft release assets. This workflow
  # only downloads them; it never edits or publishes a release.
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
      - name: Download existing draft packages without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/packages"
          gh release view v2.27.0 --json isDraft,tagName,targetCommitish
          gh release download v2.27.0 --pattern '*.AppImage' --pattern '*.deb' --dir "$RUNNER_TEMP/packages"
      - name: Install desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y "$RUNNER_TEMP"/packages/*.deb xvfb
          # Keep its dependency packages, but do not let an installed copy of
          # BSR supply libraries that the AppImage itself failed to carry.
          sudo dpkg --remove bili-shadowreplay
      - name: Inspect AppImage layout and launcher
        run: |
          mkdir -p "$RUNNER_TEMP/appimage-check"
          cd "$RUNNER_TEMP/appimage-check"
          chmod +x "$RUNNER_TEMP"/packages/*.AppImage
          "$RUNNER_TEMP"/packages/*.AppImage --appimage-extract > extraction.log
          root="$PWD/squashfs-root"
          file "$root/AppRun"
          find "$root" -name '*fontconfig*' -o -name '*fribidi*' -o -name '*avformat*' -o -name '*apprun*' -o -name 'AppRun*'
          grep -R -n -E 'LD_LIBRARY_PATH|fontconfig|exec ' "$root/apprun-hooks" "$root/AppRun" || true
          readelf -d "$root/usr/bin/bili-shadowreplay" | grep -E 'RPATH|RUNPATH'
          env -u LD_LIBRARY_PATH -u LD_PRELOAD ldd "$root/usr/bin/bili-shadowreplay" > binary-ldd.log
          grep -E 'fontconfig|fribidi|libav|not found' binary-ldd.log
      - name: Compare strict verification with actual AppRun loading
        run: |
          directory="$RUNNER_TEMP/appimage-check"
          root="$directory/squashfs-root"
          if node scripts/bundle-linux-ffmpeg.mjs --verify \
            --binary "$root/usr/bin/bili-shadowreplay" \
            --runtime "$root/usr/lib/bili-shadowreplay/ffmpeg-runtime" \
            --package-root "$root" > "$directory/verify.log" 2>&1; then
            echo "Strict verification passed"
          else
            cat "$directory/verify.log"
          fi
          mkdir -p "$directory/home" "$directory/config" "$directory/data" "$directory/cache"
          set +e
          timeout --kill-after=5s 25s xvfb-run -a env -u LD_LIBRARY_PATH -u LD_PRELOAD \
            HOME="$directory/home" XDG_CONFIG_HOME="$directory/config" \
            XDG_DATA_HOME="$directory/data" XDG_CACHE_HOME="$directory/cache" \
            LD_DEBUG=libs "$root/AppRun" > "$directory/launch.log" 2>&1
          status=$?
          set -e
          echo "AppRun exit: $status (124 means it stayed running until the timeout)"
          grep -E 'calling init:.*(libfontconfig|libfribidi|libavformat|libavcodec)|error while loading|symbol lookup error|panicked|Gtk-WARNING' "$directory/launch.log" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: appimage-loading-diagnostics
          path: ${{ runner.temp }}/appimage-check/*.log
          retention-days: 7
